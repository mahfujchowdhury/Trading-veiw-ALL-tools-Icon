<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chart Icons</title>
<style>
:root{--bg:#fff;--fg:#131722;--card:#f0f3fa;--bd:#d1d4dc}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#131722;--fg:#d1d4dc;--card:#1e222d;--bd:#363a45}}
:root[data-theme="dark"]{--bg:#131722;--fg:#d1d4dc;--card:#1e222d;--bd:#363a45}
:root[data-theme="light"]{--bg:#fff;--fg:#131722;--card:#f0f3fa;--bd:#d1d4dc}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.seg{display:flex;border:1px solid var(--bd);border-radius:8px;overflow:hidden;flex:none}
.seg button{background:var(--card);color:var(--fg);border:0;padding:6px 12px;font:inherit;cursor:pointer}
.seg button[aria-pressed="true"]{background:#2962ff;color:#fff}
body{margin:0;padding:24px;background:var(--bg);color:var(--fg);font:14px -apple-system,Segoe UI,sans-serif}
h1{font-size:18px;margin:0 0 4px}p{margin:0 0 16px;opacity:.7}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.card{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 8px;background:var(--card);border:1px solid var(--bd);border-radius:8px;color:inherit;cursor:pointer;font:inherit}
.card:hover{border-color:#2962ff}.card svg{width:48px;height:48px;color:var(--fg)}
.card span{font-size:11px;text-align:center;word-break:break-word;opacity:.8}
</style></head><body>
